name: fikajiana
description: Calculatrice, calcul formel, graphique et géométrie plane, avec saisie manuscrite hors ligne.
version: 1.1.3+42
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  crypto: ^3.0.8
  cryptography: ^2.9.0
  ffi: ^2.1.0
  fikajiana_math:
    path: ../packages/fikajiana_math
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  flutter_onnxruntime: ^1.9.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  perfect_freehand: ^2.5.2+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  # Les licences OFL voyagent avec les polices (Nunito, et les tracés de
  # Caveat dans `glyphes_caveat.dart`) : page des licences de l'app.
  assets:
    - assets/polices/OFL-Nunito.txt
    - assets/polices/OFL-Caveat.txt
    # Le petit modèle par signe (ADR 0038, 0040) : absent, les gabarits lisent seuls.
    - assets/modeles/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/polices/Nunito.ttf
