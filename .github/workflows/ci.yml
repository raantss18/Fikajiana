name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9
  VERY_GOOD_VERSION: 1.6.0

jobs:
  analyse:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Very Good CLI
        run: |
          dart pub global activate very_good_cli ${{ env.VERY_GOOD_VERSION }}
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Application
        working-directory: app
        run: |
          flutter pub get
          dart format --set-exit-if-changed lib test
          flutter analyze
          very_good test
      - name: Noyau
        working-directory: packages/fikajiana_math
        run: |
          dart pub get
          dart format --set-exit-if-changed lib test
          dart analyze
          very_good dart test

  apk:
    name: APK arm64 et x86_64
    needs: analyse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Construction (signée avec la clé de débogage, non diffusable)
        working-directory: app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  emulateur:
    name: Émulateur ${{ matrix.forme }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - forme: telephone
            profil: pixel_7
          - forme: tablette
            profil: pixel_tablet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profil }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tool/essai_emulateur.sh apk/app-x86_64-release.apk captures ${{ matrix.forme }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-${{ matrix.forme }}
          path: captures/
          if-no-files-found: warn
