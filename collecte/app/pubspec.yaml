name: collecte
description: Fikajiana Écriture, la collecte d'écriture manuscrite pour Fikajiana (ADR 0038).
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # Liens vers collecte/classes.txt et collecte/expressions.txt : une seule source.
  assets:
    - assets/classes.txt
    - assets/expressions.txt
