# Copier en `cloudrun.env.yaml` (jamais dans Git, déjà ignoré) et remplir. Lu par :
#   gcloud run deploy … --env-vars-file plateforme/cloudrun.env.yaml
# Jeton de l'export : python3 -c "import secrets; print(secrets.token_urlsafe(32))"
FIKA_JETON_ADMIN: ""
# Cloudflare R2 (S3) : seau, adresse du compte, région « auto » (doc R2 pour boto3).
FIKA_S3_SEAU: "fikajiana-dons"
FIKA_S3_ADRESSE: "https://ID_DU_COMPTE.r2.cloudflarestorage.com"
FIKA_S3_REGION: "auto"
AWS_ACCESS_KEY_ID: ""
AWS_SECRET_ACCESS_KEY: ""
# Adresses ajoutées à droite de X-Forwarded-For par Google : à confirmer avec /v1/mon-ip (étape 7).
FIKA_DERRIERE_PROXY: "1"
FIKA_DEBIT: "30"
FIKA_FENETRE: "60"
